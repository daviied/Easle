name: easel
services:
  easel:
    image: ghcr.io/daviied/easle:latest
    container_name: easel
    restart: unless-stopped
    ports:
      - target: 8080
        published: "8102"
        protocol: tcp
    environment:
      CANVAS_BASE_URL: https://yourschool.instructure.com
      CANVAS_TOKEN: paste-your-canvas-token
      APP_PASSWORD: choose-a-long-password
      TOTP_SECRET: ""
      SESSION_SECRET: ""
      SESSION_DAYS: "30"
      CACHE_TTL: "30"
      COOKIE_SECURE: auto
      FORWARDED_ALLOW_IPS: 192.168.10.4
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
    x-casaos:
      envs:
        - container: CANVAS_BASE_URL
          description:
            en_us: Your school's Canvas address, e.g. https://yourschool.instructure.com
        - container: CANVAS_TOKEN
          description:
            en_us: "Canvas access token (Account > Settings > Approved Integrations > New Access Token)"
        - container: APP_PASSWORD
          description:
            en_us: Password for signing in to Easel (12+ characters)
        - container: TOTP_SECRET
          description:
            en_us: "Optional two-factor secret for an authenticator app. Generate with: docker exec easel python -m app.totp"
        - container: SESSION_SECRET
          description:
            en_us: Optional. Change it to sign out every device.
        - container: SESSION_DAYS
          description:
            en_us: Days a sign-in lasts
        - container: CACHE_TTL
          description:
            en_us: Seconds the server reuses a Canvas response
        - container: COOKIE_SECURE
          description:
            en_us: auto, true or false
        - container: FORWARDED_ALLOW_IPS
          description:
            en_us: IP of your reverse proxy, so Easel sees real visitor IPs and HTTPS
      ports:
        - container: "8080"
          description:
            en_us: Web UI

x-casaos:
  architectures:
    - amd64
    - arm64
  main: easel
  author: self
  developer: self
  category: Utilities
  title:
    en_us: Easel
  tagline:
    en_us: A fast personal Canvas client
  description:
    en_us: Fast Canvas LMS client with assignment submission, grades, announcements, discussions, modules and files. Quizzes open on Canvas.
  icon: ""
  port_map: "8102"
  scheme: http
  index: /
